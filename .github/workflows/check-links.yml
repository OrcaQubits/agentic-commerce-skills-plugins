name: Check documentation links

# Every skill fetches live docs at invocation time. That only works while the
# URLs in its "Official Sources" / "Before writing code" block still resolve —
# a 404 there makes the fetch fail silently and the model falls back to stale
# static content. This job catches that rot before it ships.

on:
  push:
    paths:
      - '**/*.md'
      - 'scripts/check_links.mjs'
      - '.github/workflows/check-links.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_links.mjs'
  schedule:
    # Weekly — docs sites reorganise without any commit to this repo.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check links in source markdown
        run: node scripts/check_links.mjs
